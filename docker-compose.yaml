version: '3.9'

name: rentora

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentora-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3003:3003"
    networks:
      - rentora-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rentora-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - rentora-network

networks:
  rentora-network:
    name: rentora-network
    driver: bridge
