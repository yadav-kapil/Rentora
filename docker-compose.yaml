version: '3.9'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airbnb-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3003:3003"
    networks:
      - airbnb-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: airbnb-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - airbnb-network

networks:
  airbnb-network:
    driver: bridge
